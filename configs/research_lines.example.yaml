# 연구 라인 설정 예시. 노트의 "## 연구 라인에 걸리는 것", 리포트의 "## 연구에 옮길 아이디어" 절의 소제목 기준이다.
#
# 사용 방법 (둘 중 하나):
#   1. 이 파일을 ~/.config/lecture-recon/research_lines.yaml 로 복사해 고친다.
#      (설정 파일 위치를 LECTURE_RECON_CONFIG 로 바꿨으면 그 파일과 같은 디렉터리)
#   2. 다른 곳에 두고 ~/.config/lecture-recon/config.yaml 에 경로를 적는다(상대 경로는 config.yaml 디렉터리 기준):
#        research_lines: ~/my/research_lines.yaml
#
# 설정이 없거나 config.yaml 에 `research_lines: false` 면 노트·리포트에 위 두 절을 두지 않는다(scaffold 골격에도 없다).
#
# 필드:
#   id        짧은 식별자(영문·숫자·`-`). 사람이 알아보기 위한 것이다.
#   name      소제목으로 그대로 쓰는 이름(`### <name>`). 노트·리포트는 이 이름이 아닌 소제목을 버린다.
#   keywords  연결을 찾을 때 LLM 에게 주는 단서(문자열 목록).
#   note      선택. 라인에 대한 메모(우선순위, 보류 여부 등).
# 순서 = 우선순위.
lines:
  - id: llm-eval
    name: LLM 평가 벤치마크
    keywords: [benchmark, evaluation, leaderboard, contamination, LLM-as-judge]
    note: 평가 설계와 데이터 오염 문제를 주로 본다.
  - id: robot-policy
    name: 로봇 정책 학습
    keywords: [robot, policy learning, imitation learning, VLA, sim-to-real]
